name: Build Java CLI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: cli/pom.xml
      - run: mvn -B -f cli/pom.xml verify
      - uses: actions/upload-artifact@v4
        with:
          name: atomic-api-jar
          path: cli/target/atomic-api-0.1.0.jar
          if-no-files-found: error
